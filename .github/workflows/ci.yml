name: ci

on:
  pull_request:
    branches: ["canon"]
  push:
    branches: ["canon"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repo manifest (canon)
        shell: bash
        run: |
          set -Eeuo pipefail; IFS=$'\n\t'; LC_ALL=C
          test -f "MANIFEST.repo.sha256" || {
            echo "[fail] MANIFEST.repo.sha256 missing (run scripts/make_manifest.sh and commit)"
            exit 1
          }
          bash scripts/verify_manifest.sh

      - name: Reject tracked binary blobs (canon)
        shell: bash
        run: |
          set -Eeuo pipefail; IFS=$'\n\t'; LC_ALL=C
          bash scripts/no_tracked_binaries.sh

name: ci
on:
  pull_request:
    branches: [ "canon" ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden-pattern scan (identity/secrets)
        shell: bash
        run: |
          set -Eeuo pipefail
          PAT='(C:\\Users\\|/home/[^/]+/|DESKTOP-[A-Z0-9-]+|BEGIN (RSA|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})'
          if grep -RInE --exclude-dir=.git "$PAT" .; then
            echo "[fail] forbidden pattern(s) detected" >&2
            exit 1
          fi

      - name: Reject tracked binaries in canon
        shell: bash
        run: |
          set -Eeuo pipefail
          # Fail if these filetypes are tracked anywhere (canon should be text + hashes only)
          DISALLOWED='\.(png|jpe?g|webp|gif|pdf|zip|7z|rar|bin|dat|ape|aac|mp3|wav)$'
          if git ls-files | grep -E -i "$DISALLOWED"; then
            echo "[fail] disallowed binary file(s) are tracked" >&2
            exit 1
          fi

      - name: Verify manifest (if present)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/verify_manifest.sh ]]; then
            bash scripts/verify_manifest.sh
          fi

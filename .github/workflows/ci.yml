name: ci

on:
  pull_request:
    branches: ["canon"]
  push:
    branches: ["canon"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canon gate (manifest + reviewed-image allowlist + no-empty-evidence)
        shell: bash
        run: |
          set -Eeuo pipefail; LC_ALL=C
          test -x scripts/check_canon.sh || { echo "[fail] scripts/check_canon.sh missing"; exit 1; }
          bash scripts/check_canon.sh

      - name: Replay tablet and Enkidu evidence
        run: |
          python3 scripts/reproduce_tablet.py
          python3 scripts/reproduce_enkidu.py
          python3 scripts/reproduce_r2_transposition.py layers/R2-020_hex_transposition/EVIDENCE/zrUfKaKV.hex --out-dir "$RUNNER_TEMP/r2-replay"
          python3 scripts/verify_r2_independent.py layers/R2-020_hex_transposition/EVIDENCE/zrUfKaKV.hex --out-dir "$RUNNER_TEMP/r2-independent"
          python3 scripts/verify_manifesto_formatting.py layers/R1-040_deepsound_enkidu/EVIDENCE/enkidu.full_pseudohex.txt --out-dir "$RUNNER_TEMP/manifesto-formatting"

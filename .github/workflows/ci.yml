name: ci
on:
  pull_request:
    branches: [ "canon" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden-pattern scan (identity/secrets) allowing placeholders
        shell: bash
        run: |
          set -Eeuo pipefail

          # Only scan tracked files; exclude files that intentionally contain “bad-looking” examples.
          mapfile -d '' -t FILES < <(git ls-files -z -- \
            ':!.github/workflows/ci.yml' \
            ':!scripts/sanitize_logs.py' \
          )

          # 1) Secrets: never allowed anywhere
          if grep -RInE --exclude-dir=.git '(BEGIN (RSA|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})' . ; then
            echo "[fail] secrets detected" >&2
            exit 1
          fi

          # 2) Linux home paths: fail on /home/<name>/ except placeholder /home/user/
          if grep -nE '/home/[A-Za-z0-9._-]+/' "${FILES[@]}" | grep -v '/home/user/' ; then
            echo "[fail] non-placeholder /home/<user>/ path detected" >&2
            exit 1
          fi

          # 3) Windows user paths: fail on C:\Users\<name>\ except placeholder C:\Users\REDACTED\
          if grep -nE 'C:\\Users\\[A-Za-z0-9._-]+\\' "${FILES[@]}" | grep -v 'C:\\Users\\REDACTED\\' ; then
            echo "[fail] non-placeholder C:\\Users\\<user>\\ path detected" >&2
            exit 1
          fi

          # 4) Desktop hostname patterns: fail
          if grep -nE 'DESKTOP-[A-Za-z0-9-]+' "${FILES[@]}" ; then
            echo "[fail] hostname pattern detected" >&2
            exit 1
          fi

      - name: Reject tracked binaries in canon
        shell: bash
        run: |
          set -Eeuo pipefail
          DISALLOWED='\.(png|jpe?g|webp|gif|pdf|zip|7z|rar|bin|dat|ape|aac|mp3|wav)$'
          if git ls-files | grep -E -i "$DISALLOWED"; then
            echo "[fail] disallowed binary file(s) are tracked" >&2
            exit 1
          fi

      - name: Doctest sanitizer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m doctest -v scripts/sanitize_logs.py

      - name: Verify manifest (if present)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/verify_manifest.sh ]]; then
            bash scripts/verify_manifest.sh
          fi
